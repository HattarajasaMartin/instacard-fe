[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://your-backend-url.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/u/*"
  to = "https://your-backend-url.com/u/:splat"
  status = 200
  force = true

[context.production.environment]
  VITE_API_BASE_URL = "https://your-backend-url.com"
